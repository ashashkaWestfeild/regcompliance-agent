name: CI

on:
  push:
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  schema:
    # Loads db/schema.sql into a real Postgres 18 + pgvector, so the DDL is validated on every
    # push without any local database.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: regcomp
          POSTGRES_PASSWORD: regcomp_ci_only
          POSTGRES_DB: regcomp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regcomp -d regcomp"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        env:
          PGPASSWORD: regcomp_ci_only
        run: psql -h localhost -U regcomp -d regcomp -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Apply migrations twice (they must be idempotent)
        env:
          PGPASSWORD: regcomp_ci_only
        run: |
          for pass in 1 2; do
            for f in db/migrations/*.sql; do
              psql -h localhost -U regcomp -d regcomp -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      - name: Smoke-check tables
        env:
          PGPASSWORD: regcomp_ci_only
        run: psql -h localhost -U regcomp -d regcomp -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"

  audit:
    # The hosted app's pinned dependencies (app/requirements.txt, what Streamlit Cloud installs)
    # against known vulnerabilities; fails if the file has drifted from uv.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: App pins match uv.lock
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --locked \
            -o /tmp/lock.txt
          uv pip compile app/requirements.in --constraint /tmp/lock.txt --universal \
            --python-version 3.13 --no-header --no-annotate -o /tmp/app.txt
          diff <(grep -v '^#' /tmp/app.txt) <(grep -v '^#' app/requirements.txt)
      - run: uvx pip-audit -r app/requirements.txt --strict

  secrets:
    # Scans the full history for committed secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
