# Local Postgres 18 + pgvector. db/schema.sql runs automatically on first start
# (only when the data volume is empty; `docker compose down -v` to re-init).
# Then apply the migrations: `uv run python scripts/db_init.py` (idempotent).
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: regcomp-db
    environment:
      POSTGRES_USER: regcomp
      POSTGRES_PASSWORD: regcomp_local_only
      POSTGRES_DB: regcomp
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/...; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regcomp -d regcomp"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
