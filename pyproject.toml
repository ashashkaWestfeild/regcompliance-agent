[project]
name = "regcomp"
version = "0.1.0"
description = "Agentic banking regulatory compliance (RBI KYC) - ET x Accenture hackathon"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "ashashkaWestfeild", email = "priteshsingh101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
pdf = [
    "docling>=2.130.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
