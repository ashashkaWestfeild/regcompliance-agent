# Planted gaps for the Nainital Bank KYC/AML policy.
# Sample reviewed by the user on 2026-09-27 (decisions recorded in each note).
#
# Each edit: `find` must occur exactly once in the policy's Docling items (whitespace-normalised);
# `replace` "" deletes. Targets are clause refs in the current RBI Directions (v3, 18 Sep 2026).
# `target_obligation_refs` lists every acceptable regulation clause for scoring.
# `expected_gap_types` overrides the operator's default when a finding has more than one valid type.

- id: N01
  operator: weaken_threshold
  theme: periodic_rekyc
  target_obligation_refs: ["42(1)"]
  note: "High-risk re-KYC every 8 years instead of 2, a copy-paste slip from the medium-risk row (both statements). User review: changed from 5 to 8 years."
  check:  # redundant-coverage patterns (scripts/coverage_check.py only; never in prompts)
    - 'two years for high risk'
    - 'high risk[^.]{0,60}\b(two|2)\b years'
    - '\b(two|2)\b years[^.]{0,40}high risk'
  edits:
    - find: "carried out at least once in every two years for high risk customers"
      replace: "carried out at least once in every eight years for high risk customers"
    - find: "At least once in every two years for high risk customers"
      replace: "At least once in every eight years for high risk customers"

