# Planted gaps for the Nainital Bank KYC/AML policy. DRAFT SAMPLE (2026-09-26) for user review:
# realism, operator choice and targets. The full set (~12-15 per policy) follows after review.
#
# Each edit: `find` must occur exactly once in the policy's Docling items (whitespace-normalised);
# `replace` "" deletes. target_obligation_ref is a clause in the current RBI Directions (v3).
# Operators map 1:1 to expected gap types (scripts/mutate.py EXPECTED; docs/mutation_taxonomy.md).

- id: N01
  operator: weaken_threshold
  theme: periodic_rekyc
  target_obligation_ref: "42(1)"
  note: "High-risk re-KYC weakened from every 2 years to every 5 years (both statements)."
  edits:
    - find: "carried out at least once in every two years for high risk customers"
      replace: "carried out at least once in every five years for high risk customers"
    - find: "At least once in every two years for high risk customers"
      replace: "At least once in every five years for high risk customers"

- id: N02
  operator: make_stale
  theme: beneficial_owner
  target_obligation_ref: "5(1)(iv)(a)"
  note: "Company BO threshold reverted to the pre-2023 25%."
  edits:
    - find: "more than 10 per cent of the shares or capital or profits of the company"
      replace: "more than 25 per cent of the shares or capital or profits of the company"

- id: N03
  operator: delete_control
  theme: beneficial_owner
  target_obligation_ref: "5(1)(iv)(d)"
  note: "Trust beneficial-owner identification removed entirely."
  edits:
    - find: "d) Where the customer is a trust, the identification of beneficial owner(s) shall include identification of the author of the trust, the trustee, the beneficiaries with 10% or more interest in the trust and any other natural person exercising ultimate effective control over the trust through a chain of control or ownership."
      replace: ""

- id: N04
  operator: strip_design
  theme: fiu_reporting
  target_obligation_ref: "15(1)"
  note: "Named owner (who is the Principal Officer) and the FIU-IND communication step removed; the duty remains but has no accountable owner."
  edits:
    - find: "The Chief Operating Officer of the bank, posted at Head Office, Seven Oaks, Mallital, Nainital is designated as Principal Officer. The Principal Officer shall be responsible"
      replace: "The Principal Officer shall be responsible"
    - find: "The name, designation and address of the Principal Officer is communicated to the FIU-IND."
      replace: ""

- id: N05
  operator: narrow_scope
  theme: ongoing_monitoring
  target_obligation_ref: "41(2)"
  note: "Intensified monitoring limited to non-individual high-risk accounts."
  edits:
    - find: "Explanation: High risk accounts will be subjected to more intensified monitoring."
      replace: "Explanation: High risk accounts of non-individual customers will be subjected to more intensified monitoring."

- id: N06
  operator: contradict
  theme: risk_categorization
  target_obligation_ref: "41(1)"
  note: "Second statement elsewhere contradicts the six-monthly review."
  edits:
    - find: "b. The transactions in accounts of marketing firms, especially accounts of Multi-Level Marketing (MLM) Companies shall be closely monitored."
      replace: "b. The transactions in accounts of marketing firms, especially accounts of Multi-Level Marketing (MLM) Companies shall be closely monitored. Branches may carry out the review of risk categorisation of accounts once in two years."

# ---------------------------------------------------------------- decoys (must NOT raise a gap)

- id: N-D01
  operator: decoy
  theme: ongoing_monitoring
  target_obligation_ref: "68"
  note: "Rephrase only; same obligation."
  edits:
    - find: "Bank shall undertake diligence measures and meticulous monitoring to identify accounts which are operated as Money Mules and take appropriate action, including reporting of suspicious transactions to FIU-IND."
      replace: "To identify accounts operated as Money Mules, the Bank shall undertake diligence measures and meticulous monitoring and take appropriate action, including reporting of suspicious transactions to FIU-IND."

- id: N-D02
  operator: decoy
  theme: periodic_rekyc
  target_obligation_ref: "42(1)"
  note: "Stricter than RBI (medium risk every 5 years instead of 8), changed in both statements. Not a gap."
  edits:
    - find: "customers, once in every eight years for medium risk customers"
      replace: "customers, once in every five years for medium risk customers"
    - find: "At least once in every eight years for medium risk customers"
      replace: "At least once in every five years for medium risk customers"

- id: N-D03
  operator: decoy
  theme: fiu_reporting
  target_obligation_ref: "52"
  note: "Grammar fix only."
  edits:
    - find: "bank/branch shall not pursue the CDD process, and instead file an STR with FIU-IND."
      replace: "bank/branch shall not pursue the CDD process and shall instead file an STR with FIU-IND."

